name: CI

on:
  push:
  pull_request:

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e .
          pip install pytest
      - name: Test battery
        run: pytest -q
      - name: The proof — planted defects must all be caught
        run: nidra demo --strict
